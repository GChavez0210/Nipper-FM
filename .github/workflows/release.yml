name: Release

# Runs when you publish a GitHub release (or push a v* tag).
# Builds the APK and attaches it to the release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $NAME in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.NIPPERFM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret NIPPERFM_KEYSTORE_BASE64 is not set. See README for signing setup."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          NIPPERFM_KEYSTORE: ${{ steps.signing.outputs.path }}
          NIPPERFM_STORE_PASSWORD: ${{ secrets.NIPPERFM_STORE_PASSWORD }}
          NIPPERFM_KEY_ALIAS: ${{ secrets.NIPPERFM_KEY_ALIAS }}
          NIPPERFM_KEY_PASSWORD: ${{ secrets.NIPPERFM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist-release
          cp app/build/outputs/apk/release/*.apk "dist-release/NipperFM-${{ steps.version.outputs.version }}.apk"
          (cd dist-release && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: NipperFM-${{ steps.version.outputs.version }}
          path: dist-release/

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-release/* --clobber --repo "${{ github.repository }}"
